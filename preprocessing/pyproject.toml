[project]
name = "bodypose"
version = "1.0.0"
description = "Pose-vector indexing for a body-based image search engine, on Apple Neural Engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Vision does the pose detection; Quartz/ImageIO does the decoding and the
    # thumbnail encoding. Both are thin bindings over frameworks already on the
    # machine, so there is no model to download for the default backend.
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]

[project.optional-dependencies]
# Only needed for `--backend mediapipe` and for `bodypose doctor`. MediaPipe's
# wheels lag the newest Python releases; 3.11 or 3.12 is the safe choice.
mediapipe = ["mediapipe>=0.10.14", "pillow>=10.0"]

[project.scripts]
bodypose = "bodypose.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bodypose", "bodypose.backends"]
