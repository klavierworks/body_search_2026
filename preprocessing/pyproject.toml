[project]
name = "bodypose"
version = "1.0.0"
description = "Pose-vector indexing for a body-based image search engine"
# MediaPipe does not publish a wheel for every Python version. 3.11 to 3.13 are
# known to work; 3.10 is the floor the code itself needs.
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # MediaPipe is the detector at both ends of this project — here and in the
    # browser — which is what keeps the two vector spaces identical and what
    # makes this run anywhere. Pillow decodes; its JPEG draft() path is what
    # stops a 40-megapixel scan being decoded in full for a 1024px detection.
    # Pinned below 1.0 on purpose. MediaPipe 1.0.0 restructured the Python
    # package around a C API and dropped the GPU inference calculators from the
    # Linux wheel: 1.0.0's libmediapipe.so registers only
    # InferenceCalculatorCpuImpl and InferenceCalculatorXnnpackImpl, with zero
    # EGL/GL entry points, so `--delegate gpu` fails graph validation with
    # "ValidatedGraphConfig Initialization failed". The 0.10.x wheel carries
    # InferenceCalculatorGlImpl, InferenceCalculatorGlAdvancedImpl and 158 EGL
    # symbols, and runs on the GPU.
    "mediapipe>=0.10.14,<1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Apple Vision on the Neural Engine: faster than MediaPipe on Apple silicon,
# but a second detector, so only worth it if `bodypose doctor` says the two
# agree. The markers keep pip from even trying these off macOS, where the
# pyobjc build calls /usr/bin/sw_vers and dies.
vision = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
# HEIC/HEIF decoding. macOS handled these natively through ImageIO; Pillow
# needs the plugin, and without it those files land in the error column.
heif = ["pillow-heif>=0.13"]

[project.scripts]
bodypose = "bodypose.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bodypose", "bodypose.backends"]
